# GRPO on competition math (DeepScaleR-Preview, numeric-gold rows) with Qwen3.5-9B.
# Sized for 4x H100 sync (this cluster's requestable quantities are 1/2/4/8 per node):
#   torchrun --nproc_per_node=4 train.py --config configs/math_grpo_qwen35.yaml
task: math
algo: grpo
model: Qwen/Qwen3.5-9B      # hybrid GDN arch: transformers >= 5.2

n_prompts: 48          # GLOBAL batch: 12 per rank x 4 completions = 192 sequences/step
group_size: 4          # prompt diversity > group size at fixed seqs/step (measured)
micro_batch: 4         # scoring logits are [mb, ~2.3k, 151k] at 2048-token completions
gen_batch: 48          # decode is bandwidth-bound and hybrid-GDN KV is tiny; 16 measured
                       # 1070 s/step, batching the whole rank's 48 seqs into one generate

lora: true
lora_r: 32
# MLP targets exist in EVERY layer (attention q/k/v/o only in the ~25% non-GDN layers).
# With the filtered reward this run beat attention targets outright: 0.727 peak / ~0.69
# late vs 0.688 / ~0.65, plus consistent early acceleration across 3 runs (seed-1
# replicate pending). GDN-internal projections stay unadapted (vLLM LoRA compat).
lora_targets: gate_proj,up_proj,down_proj
grad_ckpt: true
dtype: bfloat16
device: cuda

steps: 100
inner_epochs: 1
lr: 5.0e-5             # 1.5e-4 trains faster on seed 0 but LENGTH-COLLAPSED on seed 1
                       # (resp_len 1300->10, answer-only guessing, eval 0.55->0.19 by step
                       # 10). 5e-5 is stable across 4 runs; 8e-5 under test.
eps: 0.2
kl_coef: 0.0
length_norm: true
norm_std: true
max_new_tokens: 2048   # smoke at 1024 truncated 37-88% of math CoT (mean resp_len ~1000)
# The soft overlong PENALTY (overlong_coef) makes short outputs strictly safe and turns a
# high-lr transient into terminal length collapse (measured: resp_len 1300->10 within 10-90
# steps depending on lr). FILTERING (no gradient through truncated seqs) ran 150 steps with
# no collapse at both 5e-5 and 8e-5, peak 0.688.
overlong_coef: 0.0
overlong_filter: true
temperature: 0.8
top_p: 1.0
think: false

seed: 0
eval_every: 10
eval_n: 128
ckpt_every: 25
n_examples: 20000
debug_samples: 2
out: runs/qwen35_9b_math
