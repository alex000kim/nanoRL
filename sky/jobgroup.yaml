# Disaggregated async RL as a SkyPilot Job Group: an 8-rank trainer + 8 vLLM rollout
# workers, discovering each other by hostname ({task}-{idx}.{group}).
#   sky jobs launch sky/jobgroup.yaml
#   sky jobs logs <id> trainer      # or: rollout
# Trainer ranks and workers move together: each rank consumes one worker submission per
# step, so 8 ranks need ~8 workers. NANORL_TOKEN gates the trainer's HTTP endpoint.
---
name: nanorl
execution: parallel

---
name: trainer
resources:
  infra: k8s
  # Pinned, not a candidate list: heterogeneous placement must be asserted.
  accelerators: H100:8
  cpus: 16+
  memory: 128+
envs:
  CFG: configs/countdown_async_vllm.yaml
  NANORL_TOKEN: nanorl-e2e
workdir: .
setup: |
  command -v uv >/dev/null || pip install -q uv
  uv pip install -q --system torch transformers "datasets<4" peft numpy pyyaml
run: |
  export HF_HOME=$HOME/.cache/huggingface
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  # micro-batch 8 fits H100 80GB at 512-token completions (16 OOMs); config's 4 is for 48GB
  torchrun --nproc_per_node=$SKYPILOT_NUM_GPUS_PER_NODE train.py \
    --config $CFG --role trainer --serve-port 8000 --micro-batch 8
---
name: rollout
num_nodes: 8                   # ~one worker per trainer rank
resources:
  infra: k8s
  accelerators: L40S:1
  cpus: 8+
  memory: 60+
envs:
  CFG: configs/countdown_async_vllm.yaml
  NANORL_TOKEN: nanorl-e2e
workdir: .
setup: |
  command -v uv >/dev/null || pip install -q uv
  uv pip install -q --system torch transformers "datasets<4" peft numpy pyyaml vllm
  # py3.10: flashinfer's `array.array[int]` annotation breaks at import; make it lazy.
  SP=$(python -c "import sysconfig;print(sysconfig.get_paths()['purelib'])")
  F="$SP/flashinfer/comm/fd_exchange.py"
  if [ -f "$F" ] && ! head -1 "$F" | grep -q "from __future__"; then
    sed -i "1i from __future__ import annotations" "$F"
  fi
run: |
  export HF_HOME=$HOME/.cache/huggingface
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  export VLLM_WORKER_MULTIPROC_METHOD=spawn   # no fork after CUDA init
  export VLLM_USE_FLASHINFER_SAMPLER=0        # image has no nvcc for the JIT sampler
  python train.py --config $CFG --role rollout --vllm \
    --vllm-gpu-frac 0.85 --vllm-max-len 2048 \
    --trainer-url http://trainer-0.nanorl:8000
