# One CPU training run on the local kind cluster from `sky local up`. No GPU, so the plain HF
# path. Single node; see sky/local_jobgroup.yaml for the trainer + rollout-worker split.
#
#   sky local up
#   sky launch -c nanorl-cpu sky/local_cpu.yaml           # setup + weight warm-up, once
#   sky exec nanorl-cpu sky/local_cpu.yaml --env ARGS="--lr 8e-5" --env NAME=lr8
#   sky down nanorl-cpu
name: nanorl-cpu

resources:
  infra: k8s/kind-skypilot   # pinned: bare `k8s` follows whatever kubeconfig points at
  cpus: 8+                   # kube-system reserves ~1 of the node's 10, so 9+ never schedules
  memory: 13+                # 1.7B fp32 is ~10.2 GB resident, plus ~1.2 KV at gen_batch 16

workdir: .

envs:
  NAME: run
  SEED: "0"
  ARGS: ""
  CONFIG: configs/ifeval_local_cpu.yaml
  OUT: ""     # default runs/$NAME_s$SEED
  CMD: ""     # run this script instead of train.py

setup: |
  set -euo pipefail
  # Own the venv: a fresh pod has no `python` on PATH and no VIRTUAL_ENV, so a bare
  # `uv pip install` fails with "No virtual environment found".
  export PATH="$HOME/.local/bin:$PATH"
  command -v uv >/dev/null || "$HOME/skypilot-runtime/bin/python" -m pip install -q uv
  uv venv "$HOME/nanorl-env" >/dev/null
  PY="$HOME/nanorl-env/bin/python"
  # CPU wheel index: plain PyPI torch pulls ~4.5 GB of unused CUDA runtime.
  uv pip install -q --python "$PY" --index-url https://download.pytorch.org/whl/cpu torch
  uv pip install -q --python "$PY" transformers "datasets<4" peft numpy pyyaml
  "$PY" -c "import torch, transformers, peft, datasets; print('env ok', torch.__version__)"

run: |
  set -euo pipefail
  # SkyPilot defaults OMP to 1. Beyond that threads are a weak lever: CPU decode is
  # bandwidth-bound, so 6/8/10 measure the same and gen_batch/micro_batch are what matter.
  export OMP_NUM_THREADS=8 MKL_NUM_THREADS=8 TOKENIZERS_PARALLELISM=false
  export HF_HOME=$HOME/.cache/huggingface
  PY="$HOME/nanorl-env/bin/python"
  if [ -n "${CMD}" ]; then
    PYTHONPATH=. "$PY" ${CMD}
  else
    OUT="${OUT:-runs/${NAME}_s${SEED}}"
    mkdir -p "$(dirname "${OUT}")"
    "$PY" train.py --config "${CONFIG}" --seed "${SEED}" --out "${OUT}" ${ARGS}
  fi
